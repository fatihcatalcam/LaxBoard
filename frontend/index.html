<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaxBoard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>Lax<span>Board</span></h1>

      <div id="user-bar">
        <span id="username-display"></span>
        <button id="btn-logout">Çıkış Yap</button>
      </div>

      <section id="set-section">
        <div class="section-strip"><div class="section-line"></div><div class="section-tag">Sets</div><div class="section-line"></div></div>
        <div id="set-controls">
          <input id="set-search" type="text" placeholder="Search sets…" />
          <button id="btn-new-set">+ New Set</button>
        </div>
        <ul id="set-list"></ul>
      </section>

      <section id="record-section">
        <div class="section-strip"><div class="section-line"></div><div class="section-tag">Record</div><div class="section-line"></div></div>
        <div id="step-nav">
          <button id="btn-step-prev">←</button>
          <span id="step-indicator">Adım 1 / 1</span>
          <button id="btn-step-next">→</button>
        </div>
        <div id="step-controls">
          <button id="btn-add-step">+ Yeni Adım</button>
          <button id="btn-del-step">× Adımı Sil</button>
        </div>
        <div id="player-buttons"></div>
        <div id="record-controls">
          <button id="btn-record" disabled>Record Player</button>
          <button id="btn-stop" disabled>Stop</button>
          <button id="btn-clear" disabled>Clear Paths</button>
        </div>
        <label id="toggle-paths-label">
          <input id="toggle-paths" type="checkbox" checked />
          Show paths
        </label>
      </section>

      <section id="playback-section">
        <div class="section-strip"><div class="section-line"></div><div class="section-tag">Playback</div><div class="section-line"></div></div>
        <div id="playback-controls">
          <button id="btn-play" disabled>Play</button>
          <button id="btn-pause" disabled>Pause</button>
          <button id="btn-save" disabled>Save</button>
        </div>
      </section>

      <div id="status-bar"></div>
    </aside>

    <main id="canvas-area">
      <canvas id="field-canvas"></canvas>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
