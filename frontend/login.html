<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaxBoard — Giriş</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0a0a12;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .logo {
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.04em;
      text-shadow: 0 0 24px rgba(233, 69, 96, 0.5);
    }
    .logo span { color: #e94560; }

    .card {
      background: #0e0e1a;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-left: 3px solid #e94560;
      border-radius: 8px;
      padding: 2rem 2rem 1.6rem;
      width: 320px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
    }

    .card-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #e94560;
      background: rgba(233, 69, 96, 0.12);
      display: inline-block;
      padding: 2px 10px;
      border-radius: 10px;
      margin-bottom: 1.6rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
      color: #555;
    }

    input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.04);
      color: #e0e0e0;
      font-size: 0.95rem;
      margin-bottom: 1.1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: rgba(233, 69, 96, 0.6); }

    button[type="submit"] {
      width: 100%;
      padding: 0.7rem;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
      box-shadow: 0 0 14px rgba(233, 69, 96, 0.35);
      transition: background 0.15s, box-shadow 0.15s;
    }
    button[type="submit"]:hover {
      background: #ff5575;
      box-shadow: 0 0 22px rgba(233, 69, 96, 0.55);
    }

    .msg { font-size: 0.82rem; margin-top: 0.7rem; display: none; }
    .msg.error  { color: #ff6b6b; }
    .msg.success { color: #6bff9e; }

    .link {
      text-align: center;
      margin-top: 1.3rem;
      font-size: 0.8rem;
      color: #444;
    }
    .link a { color: #e94560; text-decoration: none; font-weight: 600; }
    .link a:hover { color: #ff6b85; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="logo">Lax<span>Board</span></div>
    <div class="card">
      <div class="card-title">Giriş Yap</div>
      <form id="loginForm">
        <label for="username">Kullanıcı Adı</label>
        <input type="text" id="username" required autocomplete="username" />
        <label for="password">Şifre</label>
        <input type="password" id="password" required autocomplete="current-password" />
        <button type="submit">Giriş Yap</button>
        <p class="msg" id="msgEl"></p>
      </form>
      <p class="link">Hesabın yok mu? <a href="/register">Kayıt Ol</a></p>
    </div>
  </div>

  <script>
    const msgEl = document.getElementById('msgEl');

    const params = new URLSearchParams(window.location.search);
    if (params.get('registered')) {
      msgEl.className = 'msg success';
      msgEl.textContent = 'Kayıt başarılı! Giriş yapabilirsiniz.';
      msgEl.style.display = 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.style.display = 'none';
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json();
          msgEl.className = 'msg error';
          msgEl.textContent = data.error || 'Giriş başarısız';
          msgEl.style.display = 'block';
        }
      } catch {
        msgEl.className = 'msg error';
        msgEl.textContent = 'Bağlantı hatası. Tekrar deneyin.';
        msgEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
